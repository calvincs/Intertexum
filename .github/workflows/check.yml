name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.25'
      - run: uv sync --locked --extra test --python 3.13
      - run: uv run pytest -q -W error --junitxml="${{ runner.temp }}/pytest.xml"
      - name: Report test failures
        if: failure()
        run: python3 scripts/report_test_failures.py "${{ runner.temp }}/pytest.xml"
      - run: python3 scripts/check_release.py
      - run: uv build
      - run: python3 scripts/check_release.py --artifacts dist
